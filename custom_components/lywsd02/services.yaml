set_time:
  description: Set time on a LYWSD02
  fields:
    mac:
      description: BLE MAC Address of a LYWSD02
      example: "01:23:45:67:89:AB"
      required: true
    timestamp:
      description: UNIX Epoch Value Representing Desired Time
      example: 1702200346
    tz_offset:
      description: >-
        Timezone offset in hours stored on the device, which adds it to the
        timestamp itself. Without `timestamp`, the displayed time is Home
        Assistant's local time whatever this is set to.
      example: -3
    temp_mode:
      description: C = Celsius, F = Fahrenheit
      example: "C"
    clock_mode:
      description: >-
        12 or 24 hour operation. Only supported on the LYWSD02MMC; the plain
        LYWSD02 rejects it (a warning is logged and the time is still set).
      example: 12
    timeout:
      description: How long to wait for connection with LYWSD02 - increase if update is failing
      example: 10
